<div class="boot-screen">
  <img
    class="boot-screen__logo"
    src="assets/images/apple-logo.png"
    alt="apple-logo"
  />

  <div class="boot-screen__lang-toggle">
    <mat-button-toggle-group
      [value]="languageService.currentLang"
      (change)="changeLanguage($event.value)"
    >
      <mat-button-toggle value="en">EN</mat-button-toggle>
      <mat-button-toggle value="fr">FR</mat-button-toggle>
    </mat-button-toggle-group>
  </div>

  <div class="boot-screen__progress-bar">
    <p>{{ 'BOOT.MESSAGE' | translate }}</p>
    <button class="full" *ngIf="!isFullScreen" (click)="chkScreenMode()">
      <span>{{ 'BOOT.BUTTON' | translate }}</span>
    </button>
    <mat-progress-bar
      *ngIf="isFullScreen"
      mode="determinate"
      [value]="progressBarValue"
      [style]="{ height: '6px' }"
    ></mat-progress-bar>
  </div>
</div>
