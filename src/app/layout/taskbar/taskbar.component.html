<div class="taskbar">
  @for (item of icons; track item.label) {
    <div class="taskbar-item">
      <img
        class="taskbar-icon"
        src="{{ item.icon }}"
        (click)="onClick(item)"
        [alt]="item.label"
      />
    </div>
  }
  <div class="taskbar-item">
    <input
      #ico
      id="theme"
      aria-label="theme"
      class="toggle ico"
      type="checkbox"
      (click)="themeService.toggleDarkMode()"
    />
  </div>
</div>
