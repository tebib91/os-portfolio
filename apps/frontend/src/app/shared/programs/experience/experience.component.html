<div class="content" *ngIf="experience" [@fadeIn]>
  <div
    class="content-box"
    *ngFor="let project of experience.projects; let i = index"
    [attr.data-index]="i"
    [@fadeIn]
  >
    <!-- Client Section -->
    <div class="client">
      <div class="client-logo">
        <img
          [src]="project.icon"
          [alt]="project.name + ' logo'"
          (error)="onImageError($event)"
          loading="lazy"
        />
      </div>
      <div class="client-name">
        <h3>{{ project.name }}</h3>
      </div>
    </div>
    <div class="wrapper">
      <!-- Project Section -->
      <div class="project">
        <!-- Project Title -->
        <div class="project-title list-title">
          <h4>Project</h4>
          <p>{{ project.title }}</p>
        </div>

        <!-- Post Title -->
        <div class="post-title list-title">
          <h4>Post</h4>
          <p>{{ project.postTitle }}</p>
        </div>

        <!-- Project Description -->
        <div class="description">
          <h4>Description</h4>
          <p>{{ project.description }}</p>
        </div>

        <!-- Tasks -->
        <div class="tasks">
          <h4>Key Responsibilities</h4>
          <ul [@staggerList]="project.tasks.length">
            <li *ngFor="let task of project.tasks">{{ task }}</li>
          </ul>
        </div>
      </div>

      <!-- Technologies -->
      <div class="technos">
        <h4 style="text-align: center">Technologies</h4>
        <div class="tech-list" [@staggerList]="project.technos.length">
          <div class="tech-block" *ngFor="let tech of project.technos">
            <div class="tech-avatar">
              <img
                [src]="tech.icon"
                [alt]="tech.name + ' icon'"
                (error)="onImageError($event)"
                loading="lazy"
              />
            </div>
            <div class="tech-info">
              <p class="tech-name">{{ tech.name }}</p>
              <p class="tech-link" *ngIf="tech.link">
                <a [href]="tech.link" target="_blank" rel="noopener">View</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
